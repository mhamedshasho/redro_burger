name: Engine Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools and SDL3 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential git pkg-config \
            libasound2-dev libpulse-dev libaudio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev \
            libibus-1.0-dev libudev-dev libdbus-1-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux prototype
        run: |
          mkdir -p dist
          cp build/redro_burger dist/
          cp README.md dist/
          tar -czf redro-burger-linux-x86_64.tar.gz -C dist .

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: redro-burger-linux-x86_64
          path: redro-burger-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
